<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a2e"/>
      <stop offset="1" stop-color="#070910"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#cfe0ff"/>
      <stop offset="1" stop-color="#6ea8ff"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6ea8ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6ea8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- 会議テーブル（リング） -->
  <circle cx="512" cy="512" r="300" fill="none" stroke="#6ea8ff" stroke-opacity="0.22" stroke-width="6"/>
  <circle cx="512" cy="512" r="210" fill="none" stroke="#6ea8ff" stroke-opacity="0.10" stroke-width="3" stroke-dasharray="6 18"/>
  <!-- 中心へ向かう線 -->
  <g stroke="#9ec2ff" stroke-opacity="0.45" stroke-width="7" stroke-linecap="round">
    <line x1="512" y1="512" x2="300" y2="300"/>
    <line x1="512" y1="512" x2="724" y2="300"/>
    <line x1="512" y1="512" x2="724" y2="724"/>
    <line x1="512" y1="512" x2="300" y2="724"/>
  </g>
  <!-- 中心（議長） -->
  <circle cx="512" cy="512" r="190" fill="url(#halo)"/>
  <circle cx="512" cy="512" r="86" fill="url(#core)" filter="url(#glow)"/>
  <!-- 回答者4人 -->
  <g filter="url(#glow)">
    <circle cx="300" cy="300" r="64" fill="#8ab4f8"/>
    <circle cx="724" cy="300" r="64" fill="#5fd3a8"/>
    <circle cx="724" cy="724" r="64" fill="#e9a46a"/>
    <circle cx="300" cy="724" r="64" fill="#c49bff"/>
  </g>
  <g fill="#0b1020" fill-opacity="0.35">
    <circle cx="300" cy="300" r="26"/><circle cx="724" cy="300" r="26"/>
    <circle cx="724" cy="724" r="26"/><circle cx="300" cy="724" r="26"/>
  </g>
</svg>
